# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  # Not adding any file checker w/o autofixer
  # Not adding language-specific checkers handled by our linters
  - id: end-of-file-fixer
  - id: fix-byte-order-marker
  - id: mixed-line-ending
    args: [--fix=auto] # Avoid fighting other formatters
  - id: trailing-whitespace
    exclude: \.(md|diff|patch)$

# Run tools from the local project so versions come from the project's
# own dependency manifests (no duplicated version pins).
- repo: local
  hooks:
  - id: install-formatters
    name: install-formatters
    entry: |
      python -c "
      import shutil, subprocess, sys
      cmd = [shutil.which('uv'), 'pip'] if shutil.which('uv') else [sys.executable, '-m', 'pip']
      subprocess.run([*cmd, 'install', '.[check]', '-U'], check=True)
      "
    language: system
    pass_filenames: false
    require_serial: true

  - id: ruff-check
    name: ruff-check
    entry: ruff check --fix --unsafe-fixes
    language: system
    types_or: [python, pyi]
    require_serial: true

  - id: ruff-format
    name: ruff-format
    entry: ruff format
    language: system
    types_or: [python, pyi]
    require_serial: true
